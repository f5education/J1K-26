# comments can go anywhere
instructions:              # comments can go anywhere
  concurrent:
    ec2_start_instance:
      name: jp-arcadia
      returns:
      - $jp_status
      - $jp_ip_addr
    az_start_vm:
      name: us-arcadia
      returns:
      - $us_status
      - $us_ip_addr

  xc_create_user_namespace:
    user: $user
    returns:
    - $namespace
  xc_create_healthcheck:
    namespace: $namespace
    name: lee-hc
  xc_create_originpool:
    namespace: $namespace
    name: lee-op
    hc_name: lee-hc
    ip_addr: $ip_addr
    port: 80
  xc_create_loadbalancer:
    namespace: $namespace
    name: lee-lb-na
    fqdn: lee-lb-na.dev.learnf5.cloud
    op_name: lee-op
  xc_create_loadbalancer:
    namespace: $namespace
    name: lee-lb-eu
    fqdn: lee-lb-eu.dev.learnf5.cloud
    op_name: lee-op    
  
  xc_create_healthcheck:
    namespace: default
    name: default-na-hc
  xc_create_originpool:
    namespace: default
    name: arcadia-na-op
    hc_name: arcadia-na-hc
    ip_addr: $ip_addr
    port: 80
  xc_create_loadbalancer:
    namespace: default
    name: arcadia-na-lb
    fqdn: arcadia-na.dev.learnf5.cloud
    op_name: arcadia-na-op
  xc_create_loadbalancer:
    namespace: default
    name: arcadia-eu-lb
    fqdn: arcadia-eu.dev.learnf5.cloud
    op_name: arcadia-na-op
